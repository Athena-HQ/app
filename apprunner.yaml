version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm install -g pnpm
      - pnpm install --frozen-lockfile
      - pnpm run build
run:
  command: node server.js
  network:
    port: 8080
  env:
    - name: NODE_ENV
      value: "production"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: NEXT_PUBLIC_STREAM_API_KEY
      value: "nv57gv77erdh"
